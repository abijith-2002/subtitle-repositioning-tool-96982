[flake8]
# Keep lint very permissive to avoid CI failures due to style in template code.
max-line-length = 120
exclude = .git,__pycache__,build,dist,.venv,venv,env
ignore =
    E203,  # whitespace before ':'
    E266,  # too many leading '#' for block comment
    E501,  # line too long
    W503,  # line break before binary operator
    F401,  # imported but unused (allow in __init__ and compatibility imports)
per-file-ignores =
    subtitle_backend/src/api/__init__.py:F401
